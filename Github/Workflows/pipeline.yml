name: Software Delivery Pipeline

on:
  push:
    branches: [ "main" ]

jobs:
  build-and-test:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install pytest and run tests
        run: |
          pip install pytest
          pytest

      - name: Build Docker image
        run: docker build -t my-delivery-app:latest .
